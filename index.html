  kLugar: d => { M.lugar = d.l; pintarCarga(); },
  kSel: d => {
    if (M.sel[d.n]?.estado === d.e) delete M.sel[d.n];
    else { const it = CAT_ITEMS.find(i => i.nombre === d.n && i.lugar === M.lugar) || M.extra.find(i => i.nombre === d.n) || CAT_ITEMS.find(i => i.nombre === d.n); M.sel[d.n] = {...it, estado: d.e}; }
    pintarCarga();
  },
  kOtro: () => {
    const v = ($('#kOtro')?.value || '').trim(); if (!v) return;
    const nombre = v.charAt(0).toUpperCase() + v.slice(1);
    if (!M.extra.some(i => norm(i.nombre) === norm(nombre)) && !CAT_ITEMS.some(i => i.lugar === M.lugar && norm(i.nombre) === norm(nombre))) {
      const cl = clasificar(nombre, M.lugar);
      M.extra.push({nombre, lugar: M.lugar, seccion: cl.seccion, categoria: cl.categoria});
    }
    const it = M.extra.find(i => norm(i.nombre) === norm(nombre)) || CAT_ITEMS.find(i => i.lugar === M.lugar && norm(i.nombre) === norm(nombre));
    M.sel[it.nombre] = {...it, lugar: M.lugar, estado: 'hay'};
    pintarCarga(); setTimeout(() => $('#kOtro')?.focus(), 0);
  },
  kGuardar: async () => { const items = Object.values(M.sel); if (!items.length) return; if (await guardarMasivo(items)) { M.sel = {}; setTimeout(() => M.tipo === 'carga' && pintarCarga(), 300); } },
  cRevisar: () => {
    M.texto = $('#pgTexto').value; M.filas = parsearLista(M.texto);
    if (!M.filas.length) { toast('Escribe o pega al menos un producto.'); return; }
    M.paso = 'revisar'; pintarCarga();
  },
  cgIA: () => organizarIA(),
  cgGuardar: async () => { leerFilas(); const items = M.filas.filter(f => f.inc && f.nombre); if (items.length && await guardarMasivo(items)) cerrarModal(); }
};
document.addEventListener('click', e => {
  const m = $('#modal');
  if (e.target === m) { cerrarModal(); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  if (b.tagName === 'BUTTON') e.preventDefault();
  ACT[b.dataset.a]?.(b.dataset, b, e);
});
document.addEventListener('input', e => {
  if (e.target.dataset.i === 'q') { S.q = e.target.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fFile') leerFactura(t.files);
  else if (t.id === 'cFile') leerCocina(t.files);
  else if (t.dataset.c === 'carrito') {
    const [k, id] = t.dataset.k.split(':');
    const arr = k === 'p' ? S.productos : S.lista, it = arr.find(x => x.id === id);
    if (it) it.carrito = t.checked;
    actualizar((k === 'p' ? 'productos/' : 'lista/') + id, {carrito: t.checked});
    render();
  }
  else if (t.dataset.c === 'fInc') { leerRevisionFactura(); M.items[+t.dataset.i].inc = t.checked; pintarFactura(); }
  else if (t.dataset.c === 'cInc') { M.cambios[+t.dataset.i].inc = t.checked; }
  else if (t.dataset.c === 'cgInc') {
    M.filas[+t.dataset.i].inc = t.checked; t.closest('li').classList.toggle('off', !t.checked);
    const b = $('#cgGuardar'), n = M.filas.filter(f => f.inc).length; if (b) { b.textContent = `Guardar ${n}`; b.disabled = !n; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) cerrarModal();
  if (e.key === 'Enter' && e.target.id === 'lNuevo') { e.preventDefault(); agregarALista(); }
  if (e.key === 'Enter' && e.target.id === 'qNombre') { e.preventDefault(); ACT.soyNuevo(); }
  if (e.key === 'Enter' && e.target.id === 'kOtro') { e.preventDefault(); ACT.kOtro(); }
});

let tt;
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 3200); }

/* ---------- Supabase: almacén de documentos con la misma forma que usa la app ---------- */
let sb = null;
function crearDB(sb){
  const cache = {}, cargas = {}, subs = new Set();
  const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'').slice(0,20) : Date.now().toString(36) + Math.random().toString(36).slice(2,10));
  const mapa = c => cache[c] || (cache[c] = new Map());
  const avisar = c => subs.forEach(s => s.col === c && s.fn());
  const poner = (c, id, data) => { if (data == null) mapa(c).delete(id); else mapa(c).set(id, data); avisar(c); };
  const fallo = e => ({code: /42501|permission|policy|row-level/i.test(`${e.code} ${e.message}`) ? 'invalid_argument' : 'unavailable', message: e.message});
  function cargar(c){
    return cargas[c] || (cargas[c] = (async () => {
      for (let desde = 0; ; desde += 1000) {
        const {data, error} = await sb.from('docs').select('id,data').eq('coleccion', c).range(desde, desde + 999);
        if (error) { delete cargas[c]; throw fallo(error); }
        for (const r of data) mapa(c).set(r.id, r.data);
        if (data.length < 1000) break;
      }
    })());
  }
  sb.channel('docs-cambios').on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p => {
    if (p.eventType === 'DELETE') { if (p.old?.coleccion) poner(p.old.coleccion, p.old.id, null); }
    else if (p.new?.coleccion) poner(p.new.coleccion, p.new.id, p.new.data);
  }).subscribe();
  const snapDoc = (id, data) => ({id, exists: data != null, data: () => data == null ? undefined : data, metadata:{fromCache:false, hasPendingWrites:false}});
  const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
  const OPS = {'==':(a,b) => a === b, '!=':(a,b) => a !== b, '<':(a,b) => a < b, '<=':(a,b) => a <= b, '>':(a,b) => a > b, '>=':(a,b) => a >= b};
  function docRef(c, id){
    return {
      id, path: c + '/' + id,
      get: async () => { await cargar(c); return snapDoc(id, mapa(c).get(id)); },
      onSnapshot(next, err){ const s = {col:c, fn:() => next(snapDoc(id, mapa(c).get(id)))}; subs.add(s); cargar(c).then(s.fn, e => err && err(e)); return () => subs.delete(s); },
      async set(data){
        const prev = mapa(c).get(id); poner(c, id, data);
        const {error} = await sb.from('docs').upsert({coleccion:c, id, data});
        if (error) { poner(c, id, prev); throw fallo(error); }
      },
      async update(cambios){
        const prev = mapa(c).get(id); if (prev !== undefined) poner(c, id, {...prev, ...cambios});
        const {error} = await sb.rpc('fusionar_doc', {p_coleccion:c, p_id:id, p_cambios:cambios});
        if (error) { if (prev !== undefined) poner(c, id, prev); throw fallo(error); }
      },
      async delete(){
        const prev = mapa(c).get(id); poner(c, id, null);
        const {error} = await sb.from('docs').delete().match({coleccion:c, id});
        if (error) { poner(c, id, prev); throw fallo(error); }
      }
    };
  }
  function query(c, q = {w:[], o:null, l:0}){
    const run = () => {
      let xs = [...mapa(c)].map(([id, data]) => ({id, data})).filter(x => q.w.every(([f, op, v]) => OPS[op](x.data[f], v)));
      if (q.o) xs.sort((a, b) => { const r = cmp(a.data[q.o[0]] ?? '', b.data[q.o[0]] ?? ''); return q.o[1] === 'desc' ? -r : r; });
      else xs.sort((a, b) => cmp(a.id, b.id));
      if (q.l) xs = xs.slice(0, q.l);
      const docs = xs.map(x => snapDoc(x.id, x.data));
      return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata:{fromCache:false, hasPendingWrites:false}};
    };
    return {
      where: (f, op, v) => query(c, {...q, w:[...q.w, [f, op, v]]}),
      orderBy: (f, dir = 'asc') => query(c, {...q, o:[f, dir]}),
      limit: n => query(c, {...q, l:n}),
      get: async () => { await cargar(c); return run(); },
      onSnapshot(next, err){ const s = {col:c, fn:() => next(run())}; subs.add(s); cargar(c).then(s.fn, e => err && err(e)); return () => subs.delete(s); },
      doc: id => docRef(c, id || nuevoId()),
      add: async data => { const r = docRef(c, nuevoId()); await r.set(data); return r; }
    };
  }
  return {collection: c => query(c), doc: path => { const [c, id] = path.split('/'); return docRef(c, id); }};
}

/* ---------- Pantallas de acceso ---------- */
function vAcceso(){
  if (S.pantalla === 'config') return `<div class="login"><section class="card"><h2>Falta conectar la base de datos</h2><p class="muted">Edita el archivo <b>config.js</b> con la dirección y la clave pública de tu proyecto de Supabase. Los pasos están en el README.</p></section></div>`;
  if (S.pantalla === 'cargando') return `<div class="skel"></div><div class="skel"></div>`;
  if (S.pantalla === 'noautorizado') return `<div class="login"><section class="card">
      <h2>Tu correo aún no tiene acceso</h2>
      <p class="muted">Entraste como <b>${esc(S.email)}</b>. Pide a alguien de la casa que agregue tu correo en <b>Gastos → Ajustes → Correos con acceso</b> y vuelve a abrir la app.</p>
      <div class="btns"><button class="btn" data-a="recargar">Ya me agregaron</button><button class="btn ghost" data-a="salir">Usar otro correo</button></div>
    </section></div>`;
  return `<div class="login"><section class="card">
      <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:40px;height:40px"><rect x="7" y="10" width="18" height="19" rx="5" fill="var(--accent)"/><rect x="9" y="4" width="14" height="6" rx="2" fill="var(--sun)"/><path d="M11 18h10M11 22h7" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/></svg></div>
      <h1>Despensa de la Casa</h1>
      <p class="muted">Inventario, alertas de vencimiento, lista del mercado y presupuesto de la familia.</p>
      ${S.loginEnviado ? `
        <div class="banner"><p>Te enviamos un correo a <b>${esc(S.loginEnviado)}</b>. Abre el enlace desde este mismo dispositivo, o escribe aquí el código de 6 dígitos.</p></div>
        <label class="fld"><span>Código</span><input id="loginCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>
        <div class="btns"><button class="btn" data-a="verificar">Entrar</button><button class="btn ghost" data-a="otroCorreo">Usar otro correo</button></div>`
      : `
        <label class="fld"><span>Tu correo</span><input id="loginEmail" type="email" autocomplete="email" placeholder="nombre@correo.com"></label>
        <div class="btns"><button class="btn" data-a="login">Enviarme el acceso</button></div>
        <small class="hint">No necesitas contraseña: te llega un enlace o un código al correo. Solo entran los correos autorizados por la familia.</small>`}
    </section></div>`;
}
const ACCESO = {
  login: async () => {
    const email = ($('#loginEmail')?.value || '').trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Escribe un correo válido.'); return; }
    const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname}});
    if (error) { toast(/rate|seconds/i.test(error.message) ? 'Espera un minuto antes de pedir otro correo.' : 'No se pudo enviar el correo. Intenta de nuevo.'); return; }
    S.loginEnviado = email; render();
  },
  verificar: async () => {
    const token = ($('#loginCodigo')?.value || '').trim();
    if (!/^\d{6}$/.test(token)) { toast('Escribe el código de 6 dígitos.'); return; }
    const {error} = await sb.auth.verifyOtp({email: S.loginEnviado, token, type:'email'});
    if (error) toast('El código no es válido o ya venció. Pide otro.');
  },
  otroCorreo: () => { S.loginEnviado = ''; render(); },
  salir: async () => { await sb.auth.signOut(); location.reload(); },
  recargar: () => location.reload(),
  agregarMiembro: async () => {
    const email = ($('#aMiembro')?.value || '').trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Escribe un correo válido.'); return; }
    const {error} = await sb.from('miembros').upsert({email, agregado_por: S.email});
    if (error) { toast('No se pudo agregar el correo.'); return; }
    S.miembros = [...new Set([...S.miembros, email])]; render();
    toast(`Listo. Envíale el enlace de la app a ${email}.`);
  },
  quitarMiembro: async d => {
    if (d.e === S.email) { toast('No puedes quitar tu propio correo.'); return; }
    const {error} = await sb.from('miembros').delete().eq('email', d.e);
    if (error) { toast('No se pudo quitar el correo.'); return; }
    S.miembros = S.miembros.filter(m => m !== d.e); render();
  }
};
Object.assign(ACT, ACCESO);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'loginEmail') { e.preventDefault(); ACCESO.login(); }
  if (e.target.id === 'loginCodigo') { e.preventDefault(); ACCESO.verificar(); }
  if (e.target.id === 'aMiembro') { e.preventDefault(); ACCESO.agregarMiembro(); }
});

/* ---------- Arranque ---------- */
S.pantalla = 'cargando';
render();
async function arrancar(session){
  if (S.db) return;
  S.email = (session.user.email || '').toLowerCase();
  const {data, error} = await sb.from('miembros').select('email');
  if (error || !data || !data.length) { S.pantalla = 'noautorizado'; render(); return; }
  S.miembros = data.map(r => r.email);
  S.pantalla = 'app';
  const db = crearDB(sb);
  S.db = db;
  const sub = (key, q) => q.onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({id: d.id, ...d.data()}));
    S.loaded[key] = true; pedirRender();
  }, () => toast('Se perdió la conexión con los datos. Recarga la página.'));
  sub('productos', db.collection('productos'));
  sub('lista', db.collection('lista'));
  sub('compras', db.collection('compras').orderBy('fecha','desc').limit(500));
  sub('mermas', db.collection('mermas').orderBy('fecha','desc').limit(300));
  sub('recetas', db.collection('recetas'));
  sub('actividad', db.collection('actividad').orderBy('ts','desc').limit(25));
  let primeraConfig = true;
  db.doc('config/general').onSnapshot(s => {
    S.configExiste = s.exists;
    if (s.exists) S.config = {...S.config, ...s.data()};
    if (primeraConfig) { primeraConfig = false; if (!S.quien) setTimeout(() => { if ($('#modal').hidden) modalQuien(); }, 400); }
    pedirRender();
  }, () => {});
  /* Limpieza: borra movimientos de más de 30 días (máx. 20 por visita) */
  setTimeout(async () => {
    try {
      const viejos = await db.collection('actividad').where('ts','<', Date.now() - 30*864e5).limit(20).get();
      for (const d of viejos.docs) await db.doc('actividad/'+d.id).delete();
    } catch {}
  }, 8000);
}
(async () => {
  const cfg = window.CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey || /TU_/.test(cfg.supabaseUrl + cfg.supabaseAnonKey)) { S.pantalla = 'config'; render(); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange((ev, session) => { if (session && !S.db) arrancar(session); });
  const {data:{session}} = await sb.auth.getSession();
  if (session) arrancar(session); else { S.pantalla = 'login'; render(); }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
