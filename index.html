<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despensa de la Casa</title>
<meta name="description" content="Inventario de alimentos, aseo y hogar con alertas de vencimiento, lista de mercado y control del presupuesto familiar.">
<meta name="theme-color" content="#2b6c4a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 980px) con cabecera fija, pestañas arriba en escritorio y abajo en el celular; tarjetas solo donde separan tareas */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#e8eee5; --ink:#17221c; --muted:#5b6a62; --line:#d6ded2;
  --accent:#2b6c4a; --accent-ink:#ffffff; --accent-soft:#dbeae0;
  --sun:#d9921c; --sun-soft:#fcefd2;
  --hay:#2d8a56; --hay-soft:#ddf0e4; --poco:#c27c08; --poco-soft:#fbeecf; --nohay:#c2432d; --nohay-soft:#f8ded8;
  --s-ali:#2d8a56; --s-ase:#2b7bad; --s-hog:#8a5ca8;
  --shadow:0 1px 2px rgb(23 50 35 / .06), 0 6px 20px rgb(23 50 35 / .07);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1411; --surface:#171f1a; --surface-2:#202a24; --ink:#e5ece7; --muted:#9aa89f; --line:#2b362f;
  --accent:#6cc497; --accent-ink:#0b1a12; --accent-soft:#1c3a29;
  --sun:#f0b23e; --sun-soft:#382c13;
  --hay:#5cc28a; --hay-soft:#163324; --poco:#e8a83a; --poco-soft:#382b11; --nohay:#ef7c66; --nohay-soft:#3c1d17;
  --s-ali:#5cc28a; --s-ase:#5eaee0; --s-hog:#bb96d4;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1411; --surface:#171f1a; --surface-2:#202a24; --ink:#e5ece7; --muted:#9aa89f; --line:#2b362f;
  --accent:#6cc497; --accent-ink:#0b1a12; --accent-soft:#1c3a29;
  --sun:#f0b23e; --sun-soft:#382c13;
  --hay:#5cc28a; --hay-soft:#163324; --poco:#e8a83a; --poco-soft:#382b11; --nohay:#ef7c66; --nohay-soft:#3c1d17;
  --s-ali:#5cc28a; --s-ase:#5eaee0; --s-hog:#bb96d4;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
.login{max-width:440px;margin:6vh auto 0}
.login .card{gap:16px}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,34px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small,.small{font-size:13px}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px}
.brand svg{width:30px;height:30px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:14px}
.who .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.help{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.tabs{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:2.5px solid transparent}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--nohay);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge.n{background:var(--accent);color:var(--accent-ink)}
main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:none;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}
  .tab{flex-direction:column;gap:2px;padding:6px 4px;font-size:11.5px;border-bottom:0;flex:1}
  .tab[aria-current="page"]{color:var(--accent)}
  .tab .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  main{padding-bottom:110px}
  .who .nm{display:none}
  .who{padding:5px}
}

/* Bloques */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-h > div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.intro{display:flex;flex-direction:column;gap:6px}
.intro p{color:var(--muted);max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.sec-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.tip svg{width:20px;height:20px;flex:none;color:var(--sun);margin-top:1px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.banner p{flex:1;min-width:200px}
.banner.warn{background:var(--nohay-soft)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{color:var(--nohay)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{color:var(--muted);font-weight:500;margin-left:3px}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;width:34px;height:34px;border-radius:10px;flex:none}
.x:hover{background:var(--surface-2)}
.x.sm{font-size:18px;width:28px;height:28px}

/* Pills de estado */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.hay{background:var(--hay-soft);color:var(--hay)}
.pill.poco{background:var(--poco-soft);color:var(--poco)}
.pill.nohay{background:var(--nohay-soft);color:var(--nohay)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* Semáforo */
.sema{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.sema{grid-template-columns:1fr}}
.sem{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.sem .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.sem .lbl{font-weight:700}
.sem small{color:var(--muted)}
.sem.r .big{color:var(--nohay)} .sem.a .big{color:var(--poco)} .sem.v .big{color:var(--accent)}
.sem.v .big{font-size:26px}

/* Lista de productos */
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-name{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.item-name b{font-weight:600;overflow-wrap:anywhere}
.item-name small{color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item.est-nohay .item-name b{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.estados{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex:none}
.estados button{border:0;background:none;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px}
.estados button i{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;display:block}
.estados .e-hay[aria-pressed="true"]{background:var(--hay);color:#fff}
.estados .e-poco[aria-pressed="true"]{background:var(--poco);color:#fff}
.estados .e-nohay[aria-pressed="true"]{background:var(--nohay);color:#fff}
.estados .e-hay i{background:currentColor}
.estados .e-poco i{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.estados.big{width:100%}
.estados.big button{flex:1;justify-content:center;padding:10px;font-size:14px}
@media (max-width:480px){.estados button span{display:none}.estados button{padding:8px 10px}.estados.big button span{display:inline}}
.group-h{display:flex;align-items:center;gap:8px;padding-top:6px}
.group-h h3{font-size:15px}
.group-h .c{color:var(--muted);font-size:13px}

/* Alertas */
.alert{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.alert.r{background:var(--nohay-soft)} .alert.a{background:var(--poco-soft)}
.alert .t{flex:1;min-width:150px;display:flex;flex-direction:column}
.alert .t b{font-weight:700}
.alert .t small{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}

/* Guía */
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;counter-reset:paso}
.step{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.step p{font-size:14px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px}

/* Mercado */
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.litem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.litem:first-child{border-top:0}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible + .box{outline:2.5px solid var(--accent);outline-offset:2px}
.litem.done .lname{text-decoration:line-through;color:var(--muted)}
.lname{overflow-wrap:anywhere;font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:160px}
.compra{border-top:1px solid var(--line);padding:10px 0}
.compra:first-child{border-top:0}
.compra summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;flex-wrap:wrap}
.compra summary::-webkit-details-marker{display:none}
.compra summary .t{flex:1;min-width:160px;display:flex;flex-direction:column}
.compra summary .v{font-weight:700;font-family:var(--f-display);font-size:17px}
.compra .det{padding:10px 0 4px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px}

/* Campos */
input[type=text],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;min-width:0}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span{font-weight:700;font-size:14px}
.fld em{font-style:normal;color:var(--muted);font-weight:500}
.hint{color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:110px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px}

/* Gastos */
.meter{position:relative;height:16px;border-radius:99px;background:var(--surface-2);overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.meter .fill.over{background:var(--nohay)}
.meter .mid{position:absolute;top:-4px;bottom:-4px;left:50%;width:2px;background:var(--muted);opacity:.5}
.meter .pace{position:absolute;top:-7px;width:0;height:30px;border-left:2px dashed var(--ink)}
.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.bigmoney{font-family:var(--f-display);font-size:clamp(30px,6vw,42px);font-weight:800;line-height:1}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hbar .bar{grid-column:1 / -1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .bar span{display:block;height:100%;border-radius:99px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.q{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}

/* Recetas */
.receta{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.receta .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.ing{display:flex;flex-wrap:wrap;gap:6px}
.ing span{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--hay-soft);color:var(--hay);font-weight:600}
.ing span.no{background:var(--nohay-soft);color:var(--nohay)}
.receta ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.receta details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
.ia-card{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.feed li{display:flex;gap:10px;align-items:baseline}
.feed time{color:var(--muted);font-size:12.5px;white-space:nowrap;margin-left:auto}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgb(10 20 14 / .45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.modal{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;width:min(640px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0 / .3);overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1}
.sheet-b{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.sheet-f .sp{flex:1}
.drop{border:2px dashed var(--line);border-radius:16px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop svg{width:40px;height:40px;color:var(--accent)}
.drop b{font-family:var(--f-display);font-size:18px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2.5px solid var(--accent)}
.rev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rev li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2)}
.rev li.off{opacity:.55}
.rev .fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(90px,1fr);gap:6px}
@media (max-width:520px){.rev .fields{grid-template-columns:1fr 1fr}.rev .fields > :first-child{grid-column:1 / -1}}
.rev small{grid-column:2;color:var(--muted)}
.rev input[type=checkbox],.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.chk span{flex:1;min-width:0}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.todo li:first-child{border-top:0}
.todo li > div{flex:1;min-width:180px;display:flex;flex-direction:column}
.todo li small{color:var(--muted)}
.todo .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.todo li.ok .tick{background:var(--hay);border-color:var(--hay);color:#fff}
.todo li.ok b{text-decoration:line-through;color:var(--muted)}
.metodos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.metodo{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.metodo:hover{border-color:var(--accent)}
.metodo svg{width:28px;height:28px;color:var(--accent)}
.metodo b{font-family:var(--f-display);font-size:16px}
.metodo small{color:var(--muted)}
.rev .fields.f4{grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr))}
@media (max-width:520px){.rev .fields.f4{grid-template-columns:1fr 1fr 1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:24px}}
.skel{height:90px;border-radius:var(--r);background:var(--surface-2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="10" width="18" height="19" rx="5" fill="var(--accent)"/><rect x="9" y="4" width="14" height="6" rx="2" fill="var(--sun)"/><path d="M11 18h10M11 22h7" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Despensa de la Casa</span>
    </div>
    <span class="sp"></span>
    <button class="help" data-a="guia" aria-label="Cómo funciona" title="Cómo funciona">?</button>
    <button class="who" id="who" data-a="quien"><span class="av">?</span><span class="nm">¿Quién eres?</span></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</header>
<main id="main"><div class="skel"></div><div class="skel"></div></main>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
/* ---------- Catálogos ---------- */
const SECC = {
  alimentos:{n:'Alimentos', c:'var(--s-ali)'},
  aseo:{n:'Aseo y limpieza', c:'var(--s-ase)'},
  hogar:{n:'Mantenimiento y dotación', c:'var(--s-hog)'}
};
const CATS = {
  alimentos:['Frutas y verduras','Carnes, pollo y pescado','Lácteos y huevos','Granos, arroz y pastas','Harinas y panadería','Enlatados y conservas','Salsas, aceites y condimentos','Bebidas y café','Snacks y dulces','Congelados','Otros alimentos'],
  aseo:['Aseo personal','Limpieza de la casa','Lavandería','Papel y desechables','Otros de aseo'],
  hogar:['Bombillos y eléctricos','Pilas y baterías','Ferretería y arreglos','Cocina y menaje','Toallas, sábanas y textiles','Otros del hogar']
};
const LUGARES = ['Nevera','Congelador','Alacena','Frutero','Baño','Lavadero','Bodega','Otro'];
/* Días aproximados que dura un perecedero desde la compra */
const VIDA = {'Frutas y verduras':7,'Carnes, pollo y pescado':3,'Lácteos y huevos':10,'Harinas y panadería':5,'Congelados':60};
const EST = {hay:{n:'Hay',c:'hay'}, poco:{n:'Queda poco',c:'poco'}, nohay:{n:'Se acabó',c:'nohay'}};
/* Catálogo de la canasta familiar colombiana para la carga inicial: [lugar, sección, categoría, productos] */
const CATALOGO = [
  ['Nevera','alimentos','Lácteos y huevos','Leche entera|Huevos|Queso campesino|Queso tajado|Mantequilla|Yogur|Kumis|Crema de leche'],
  ['Nevera','alimentos','Carnes, pollo y pescado','Pechuga de pollo|Pollo en presas|Carne de res|Carne molida|Carne de cerdo|Pescado|Jamón|Salchichas|Chorizo'],
  ['Nevera','alimentos','Frutas y verduras','Tomate|Cebolla cabezona|Cebolla larga|Zanahoria|Lechuga|Pimentón|Cilantro|Limón|Aguacate|Brócoli|Habichuela|Fresas|Mora'],
  ['Nevera','alimentos','Harinas y panadería','Arepas'],
  ['Nevera','alimentos','Salsas, aceites y condimentos','Salsa de tomate|Mayonesa|Mostaza'],
  ['Congelador','alimentos','Congelados','Pollo congelado|Carne congelada|Pescado congelado|Arveja congelada|Papas a la francesa|Pulpa de fruta|Helado'],
  ['Frutero','alimentos','Frutas y verduras','Banano|Plátano|Papa pastusa|Papa criolla|Yuca|Ajo|Mango|Naranja|Mandarina|Manzana|Papaya|Guayaba|Piña'],
  ['Alacena','alimentos','Granos, arroz y pastas','Arroz|Lentejas|Fríjol|Garbanzo|Arveja seca|Pasta|Avena'],
  ['Alacena','alimentos','Harinas y panadería','Harina de maíz|Harina de trigo|Pan tajado|Tostadas'],
  ['Alacena','alimentos','Salsas, aceites y condimentos','Aceite|Sal|Azúcar|Panela|Vinagre|Comino|Color (achiote)|Pimienta|Caldo de gallina en cubos|Ajo en polvo'],
  ['Alacena','alimentos','Enlatados y conservas','Atún|Sardinas|Maíz tierno|Mermelada|Leche condensada'],
  ['Alacena','alimentos','Bebidas y café','Café|Chocolate de mesa|Aromáticas|Leche en polvo|Jugo en caja|Gaseosa|Agua en botella'],
  ['Alacena','alimentos','Snacks y dulces','Galletas|Cereal|Gelatina|Paquetes de mecato|Bocadillo'],
  ['Baño','aseo','Aseo personal','Jabón de baño|Champú|Acondicionador|Crema dental|Cepillos de dientes|Desodorante|Toallas higiénicas|Máquinas de afeitar|Crema corporal|Copitos'],
  ['Baño','aseo','Papel y desechables','Papel higiénico'],
  ['Lavadero','aseo','Lavandería','Detergente en polvo|Detergente líquido|Suavizante|Jabón en barra|Blanqueador'],
  ['Lavadero','aseo','Limpieza de la casa','Lavaloza|Esponjas|Limpiador multiusos|Desinfectante de pisos|Ambientador|Insecticida|Guantes de aseo'],
  ['Lavadero','aseo','Papel y desechables','Bolsas de basura|Toallas de cocina|Servilletas|Papel aluminio|Vinipel'],
  ['Bodega','hogar','Bombillos y eléctricos','Bombillos LED|Cinta aislante|Extensión eléctrica'],
  ['Bodega','hogar','Pilas y baterías','Pilas AA|Pilas AAA'],
  ['Bodega','hogar','Ferretería y arreglos','Pegante|Tornillos y chazos|Velas|Fósforos|Filtro de agua|Pipeta de gas'],
  ['Bodega','hogar','Cocina y menaje','Limpiones|Escoba|Trapeadora|Recogedor|Balde'],
  ['Bodega','hogar','Toallas, sábanas y textiles','Toallas de baño|Sábanas']
];
const CAT_ITEMS = CATALOGO.flatMap(([lugar, seccion, categoria, ns]) => ns.split('|').map(nombre => ({nombre, lugar, seccion, categoria})));
const LUGARES_CARGA = ['Nevera','Congelador','Frutero','Alacena','Baño','Lavadero','Bodega'];
const MOTIVO = {nohay:'Se acabó', poco:'Queda poco', manual:'Agregado', nuevo:'Nuevo'};

const ICON = {
  inicio:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  despensa:'<rect x="5" y="8" width="14" height="13" rx="3"/><path d="M7 3h10v5H7z"/><path d="M5 13h14"/>',
  cocinar:'<path d="M4 10h16v4a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 10h20"/><path d="M9 6c0-1.2 1.2-1.2 1.2-2.4M14 6c0-1.2 1.2-1.2 1.2-2.4"/>',
  mercado:'<path d="M3 4h2.2l2.4 11h10.8L21 7H6.3"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
  gastos:'<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',
  camara:'<path d="M3.5 8h3.5l2-3h6l2 3h3.5v11.5h-17z"/><circle cx="12" cy="13.2" r="3.6"/>',
  factura:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  ia:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  bombillo:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'
};
const ico = (k, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const hoy = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseIso = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const sumarDias = (s, n) => { const d = parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const dias = s => s ? Math.round((parseIso(s) - hoy()) / 864e5) : null;
const mesKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const cop = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const corto = n => n >= 1e6 ? (Math.round(n/1e5)/10).toString().replace('.',',') + ' M' : n >= 1e3 ? Math.round(n/1e3) + ' mil' : String(Math.round(n||0));
const pesos = v => Number(String(v ?? '').replace(/[^\d]/g,'')) || 0;
const fechaLarga = d => d.toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'});
const fechaCorta = s => parseIso(s).toLocaleDateString('es-CO',{day:'numeric', month:'short'}).replace('.','');
const opts = (arr, sel) => arr.map(o => `<option${o===sel?' selected':''}>${esc(o)}</option>`).join('');
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const hace = ts => { const m = Math.round((Date.now()-ts)/6e4); if (m < 1) return 'ahora'; if (m < 60) return `hace ${m} min`; const h = Math.round(m/60); if (h < 24) return `hace ${h} h`; const d = Math.round(h/24); return d === 1 ? 'ayer' : `hace ${d} días`; };
const lugarSugerido = (secc, cat) => secc === 'alimentos' ? (cat === 'Congelados' ? 'Congelador' : ['Carnes, pollo y pescado','Lácteos y huevos','Frutas y verduras'].includes(cat) ? 'Nevera' : 'Alacena') : secc === 'aseo' ? (cat === 'Aseo personal' ? 'Baño' : 'Lavadero') : 'Bodega';

/* ---------- Estado ---------- */
const TABS = [['inicio','Inicio'],['despensa','Despensa'],['cocinar','Cocinar'],['mercado','Mercado'],['gastos','Gastos']];
const S = {
  productos:[], lista:[], compras:[], mermas:[], recetas:[], actividad:[],
  config:{presupuesto:8000000, diasAlerta:3, familia:[]}, configExiste:false,
  loaded:{}, db:null, offline:false, readonly:false, sample:null, imgs:null,
  tab: TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : (lsGet('tab') || 'inicio'),
  fSecc:'todas', fLugar:'todos', q:'',
  ia:{estado:'idle', recetas:[], err:''},
  quien: lsGet('quien') || '', guiaOculta: lsGet('guia-oculta') === '1'
};
let M = {};   // estado del modal abierto

const byId = id => S.productos.find(p => p.id === id);
const porNombre = n => S.productos.find(p => norm(p.nombre) === norm(n));
const quien = () => S.quien || 'Alguien';

function venceInfo(p){
  if (!p.vence || p.estado === 'nohay') return null;
  const d = dias(p.vence), a = S.config.diasAlerta || 3;
  const aprox = p.venceAprox ? ' (aprox.)' : '';
  let t;
  if (d < 0) t = d === -1 ? 'Venció ayer' : `Venció hace ${-d} días`;
  else if (d === 0) t = 'Vence hoy';
  else if (d === 1) t = 'Vence mañana';
  else if (d <= 30) t = `Vence en ${d} días`;
  else t = `Vence ${fechaCorta(p.vence)}`;
  return {d, t: t + aprox, c: d < 0 ? 'nohay' : d <= a ? 'poco' : 'neutral'};
}
function alertas(){
  const a = S.config.diasAlerta || 3;
  const con = S.productos.filter(p => p.vence && p.estado !== 'nohay').map(p => ({p, d: dias(p.vence)})).sort((x,y) => x.d - y.d);
  return {
    vencidos: con.filter(x => x.d < 0),
    pronto: con.filter(x => x.d >= 0 && x.d <= a),
    semana: con.filter(x => x.d >= 0 && x.d <= 7)
  };
}
function listaItems(){
  const deP = S.productos.filter(p => !p.noComprar && (p.estado !== 'hay' || p.enLista)).map(p => ({
    key:'p:'+p.id, tipo:'p', id:p.id, nombre:p.nombre, seccion:p.seccion||'alimentos', carrito:!!p.carrito,
    motivo: p.estado === 'nohay' ? 'nohay' : p.estado === 'poco' ? 'poco' : 'manual'
  }));
  const extras = S.lista.map(l => ({key:'l:'+l.id, tipo:'l', id:l.id, nombre:l.nombre, seccion:l.seccion||'alimentos', carrito:!!l.carrito, motivo:'nuevo'}));
  return [...deP, ...extras];
}
function repartir(c){
  const r = {alimentos:0, aseo:0, hogar:0, sin:0}; let asign = 0;
  const total = +c.total || 0;
  if (c.reparto) for (const k of ['alimentos','aseo','hogar']) { const v = +c.reparto[k] || 0; r[k] += v; asign += v; }
  else if (Array.isArray(c.items)) for (const it of c.items) { const v = +it.valor || 0; if (r[it.seccion] !== undefined) { r[it.seccion] += v; asign += v; } }
  if (asign > total && asign > 0) { const f = total / asign; for (const k of ['alimentos','aseo','hogar']) r[k] = Math.round(r[k]*f); }
  else r.sin = total - asign;
  return r;
}
function mesStats(key){
  const cs = S.compras.filter(c => String(c.fecha||'').startsWith(key));
  const st = {total:0, q1:0, q2:0, n:cs.length, secc:{alimentos:0,aseo:0,hogar:0,sin:0}, tiendas:{}, peq:{n:0,total:0}, perdido:0, nPerdido:0};
  for (const c of cs) {
    const t = +c.total || 0; st.total += t;
    if (+String(c.fecha).slice(8,10) <= 15) st.q1 += t; else st.q2 += t;
    const r = repartir(c); for (const k in r) st.secc[k] += r[k];
    const tn = (c.tienda || 'Sin tienda').trim(); st.tiendas[tn] = (st.tiendas[tn]||0) + t;
    if (c.tipo === 'pequena') { st.peq.n++; st.peq.total += t; }
  }
  for (const m of S.mermas.filter(m => String(m.fecha||'').startsWith(key))) { st.perdido += +m.valor || 0; st.nPerdido++; }
  return st;
}
function proximoJueves(){
  const d = hoy(); const diff = (4 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff); return {d, diff};
}

/* ---------- Escrituras ---------- */
const colec = n => S.db.collection(n);
function errMsg(e){
  if (e && e.code === 'invalid_argument') { S.readonly = S.readonly || null; return 'No tienes permiso para guardar. Pide que te compartan la app como editor.'; }
  if (e && e.code === 'quota_exceeded') return 'Se llenó el espacio de la app. Borra compras o ejemplos antiguos.';
  return 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
}
async function guardar(fn, ok){
  if (!S.db) { toast('No hay conexión con los datos. Abre la app desde Claude con tu cuenta.'); return false; }
  try { await fn(); if (ok) toast(ok); return true; }
  catch (e) { toast(errMsg(e)); return false; }
}
const colas = {};
function actualizar(path, data){
  colas[path] = (colas[path] || Promise.resolve()).then(() => S.db.doc(path).update(data)).catch(e => toast(errMsg(e)));
  return colas[path];
}
function registrar(txt){
  if (!S.db) return;
  colec('actividad').add({txt, por: quien(), ts: Date.now()}).catch(() => {});
}

/* ---------- Render ---------- */
let rafPend = false;
function pedirRender(){ if (rafPend) return; rafPend = true; requestAnimationFrame(() => { rafPend = false; render(); }); }
function render(){
  const a = document.activeElement, fid = a && a.id && $('#main').contains(a) ? a.id : null;
  let s1 = null, s2 = null; try { s1 = a.selectionStart; s2 = a.selectionEnd; } catch {}
  const enApp = S.pantalla === 'app';
  $('#tabs').hidden = !enApp; $('#who').hidden = !enApp; document.querySelector('.help').hidden = !enApp;
  if (!enApp) { $('#main').innerHTML = vAcceso(); return; }
  renderTop();
  const views = {inicio:vInicio, despensa:vDespensa, cocinar:vCocinar, mercado:vMercado, gastos:vGastos};
  $('#main').innerHTML = (views[S.tab] || vInicio)();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (s1 != null) el.setSelectionRange(s1, s2); } catch {} } }
}
function renderTop(){
  const al = alertas(), nl = listaItems().filter(i => !i.carrito).length;
  const badges = {despensa: al.vencidos.length + al.pronto.length, mercado: nl};
  $('#tabs').innerHTML = TABS.map(([k,n]) => `<button class="tab" data-a="tab" data-t="${k}" ${S.tab===k?'aria-current="page"':''}>${ico(k)}<span>${n}</span>${badges[k] ? `<span class="badge ${k==='mercado'?'n':''}">${badges[k]}</span>` : ''}</button>`).join('');
  const w = $('#who');
  w.innerHTML = `<span class="av">${esc((S.quien||'?').slice(0,1).toUpperCase())}</span><span class="nm">${S.quien ? esc(S.quien) : '¿Quién eres?'}</span>`;
}
const cargando = k => !S.offline && !S.loaded[k];
const hayEjemplos = () => [S.productos, S.compras, S.mermas, S.recetas].some(a => a.some(x => x.ejemplo));
const bannerEjemplos = () => hayEjemplos() ? `<div class="banner"><p><b>Estás viendo datos de ejemplo</b> para que veas cómo funciona. Cuando quieras empezar con lo de tu casa, quítalos.</p><button class="btn sm" data-a="quitarEjemplos">Quitar ejemplos</button></div>` : '';

function estBtns(cur, act, id=''){
  return ['hay','poco','nohay'].map(e => `<button class="e-${e}" data-a="${act}" data-id="${id}" data-e="${e}" aria-pressed="${cur===e}" title="${EST[e].n}"><i></i><span>${e==='nohay'?'No hay':e==='poco'?'Poco':'Hay'}</span></button>`).join('');
}
function filaProducto(p){
  const v = venceInfo(p);
  return `<li class="item est-${p.estado}">
    <span class="dot" style="--c:${(SECC[p.seccion]||SECC.alimentos).c}" title="${esc((SECC[p.seccion]||SECC.alimentos).n)}"></span>
    <button class="item-name" data-a="editar" data-id="${p.id}"><b>${esc(p.nombre)}</b><small>${esc(p.categoria||'')}${v ? ` <span class="pill ${v.c}">${v.t}</span>` : ''}</small></button>
    <div class="estados" role="group" aria-label="¿Cuánto hay de ${esc(p.nombre)}?">${estBtns(p.estado,'est',p.id)}</div>
  </li>`;
}

/* ---------- Vista: Inicio ---------- */
function vInicio(){
  if (cargando('productos')) return `<div class="skel"></div><div class="skel"></div>`;
  const al = alertas(), li = listaItems(), m = mesStats(mesKey(hoy())), P = S.config.presupuesto || 0;
  const pj = proximoJueves();
  const saludo = S.quien ? `Hola, ${esc(S.quien)}` : 'Hola';
  const guia = S.guiaOculta ? '' : `<section class="card">
      <div class="card-h"><div><h2>Así funciona, en 4 pasos</h2><p class="muted">La idea es que registrar tome segundos. Cada persona de la casa lo hace desde su celular.</p></div><button class="x" data-a="ocultarGuia" aria-label="Ocultar guía">×</button></div>
      ${guiaPasos()}
    </section>`;
  const filaAlerta = (x, cls) => `<div class="alert ${cls}">
      <span class="dot" style="--c:var(--${cls==='r'?'nohay':'poco'})"></span>
      <div class="t"><b>${esc(x.p.nombre)}</b><small>${venceInfo(x.p).t} · ${esc(x.p.lugar||'')}</small></div>
      ${cls==='r'
        ? `<button class="btn sm" data-a="botar" data-id="${x.p.id}">Lo boté</button><button class="btn sm ghost" data-a="editar" data-id="${x.p.id}">Aún sirve</button>`

    <section class="card">

      ${act.length ? `<ul class="feed">${act.map(a => `<li><span><b>${esc(a.por)}</b> ${esc(a.txt)}</span><time>${hace(a.ts)}</time></li>`).join('')}</ul>` : `<p class="muted">Todavía no hay movimientos. Aparecerán cuando alguien marque, compre o cocine algo.</p>`}

function listaParaEmpezar(){
  if (lsGet('arranque-oculto') === '1') return '';
  const reales = a => a.filter(x => !x.ejemplo);
  const mes = mesKey(hoy());
  const pasos = [
    {ok: !!S.quien, t:'Escribe tu nombre', d:'Para saber quién hace cada cambio.', b:'<button class="btn sm" data-a="quien">Escribir</button>'},
    {ok: !hayEjemplos(), t:'Quita los datos de ejemplo', d:'Deja la app lista para lo de tu casa.', b:'<button class="btn sm" data-a="quitarEjemplos">Quitar</button>'},
    {ok: reales(S.productos).length >= 20, t:'Carga el inventario inicial', d:`Lugar por lugar, con el catálogo, una lista o fotos. Llevas ${reales(S.productos).length}.`, b:'<button class="btn sm" data-a="carga">Cargar</button>'},
    {ok: (S.miembros||[]).length >= 2, t:'Invita a la familia', d:'Agrega el correo de cada persona y envíales el enlace de la app.', b:'<button class="btn sm" data-a="tab" data-t="gastos">Agregar correos</button>'},
    {ok: reales(S.compras).some(c => String(c.fecha).startsWith(mes)), t:'Registra lo que ya gastaste este mes', d:'Así el presupuesto arranca con la cifra real.', b:`<button class="btn sm" data-a="${S.imgs?'factura':'gasto'}">Registrar</button>`},
    {ok: reales(S.recetas).length >= 3, t:'Guarda 3 recetas de la casa', d:'Las comidas que más hacen. La app te dirá si hay todo.', b:'<button class="btn sm" data-a="nuevaReceta">Agregar</button>'}

  if (hechos === pasos.length) return '';
  return `<section class="card">
    <div class="card-h"><div><span class="sec-t">Para empezar · ${hechos} de ${pasos.length}</span><h2>Deja la app lista en 6 pasos</h2></div><button class="x" data-a="ocultarArranque" aria-label="Ocultar">×</button></div>
    <div class="progress"><span style="width:${hechos/pasos.length*100}%"></span></div>
    <ul class="todo">${pasos.map(p => `<li class="${p.ok?'ok':''}"><span class="tick">${p.ok?'✓':''}</span><div><b>${p.t}</b><small>${p.d}</small></div>${p.ok ? '' : p.b}</li>`).join('')}</ul>
  </section>`;
}
function guiaPasos(){

    <div class="step"><span class="n">2</span><h3>Un toque cuando algo cambia</h3><p>Marca <b>Hay</b>, <b>Poco</b> o <b>No hay</b>. Lo que se acaba pasa solo a la lista del mercado.</p></div>
    <div class="step"><span class="n">3</span><h3>Mercado de la quincena</h3><p>Lleva la lista, marca lo que echas al carrito y al final registra el total pagado.</p></div>
    <div class="step"><span class="n">4</span><h3>Cada jueves, el resumen</h3><p>Cocina primero lo que se vence y revisa cómo va el presupuesto del mes.</p></div>
  </div>
  <div class="legend"><span class="pill hay">● Hay suficiente</span><span class="pill poco">◐ Queda poco: va a la lista</span><span class="pill nohay">○ Se acabó: va a la lista</span></div>`;
}
function resumenJueves(al, li, m, P, pj){
  const esJueves = pj.diff === 0;
  const d = hoy(), diasMes = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(), dia = d.getDate();
  const q = dia <= 15 ? 1 : 2, gq = q === 1 ? m.q1 : m.q2, pq = P/2;
  const nohay = li.filter(i => i.motivo === 'nohay').length, poco = li.filter(i => i.motivo === 'poco').length;
  return `<section class="card">
    <div class="card-h"><div><span class="sec-t">${esJueves ? 'Hoy es jueves' : `Próximo resumen: jueves ${pj.d.getDate()} de ${pj.d.toLocaleDateString('es-CO',{month:'long'})}`}</span><h2>Resumen de la semana</h2><p class="muted">Revísalo cada jueves: hay tiempo para planear el fin de semana y adelantar la lista.</p></div></div>
    <div class="grid3">
      <div class="q"><span class="sec-t">Úsalo esta semana</span>${al.semana.length ? `<div class="chips">${al.semana.slice(0,8).map(x => `<span class="pill ${x.d<=(S.config.diasAlerta||3)?'poco':'neutral'}">${esc(x.p.nombre)} · ${x.d===0?'hoy':x.d+'d'}</span>`).join('')}</div>` : '<span class="muted small">Nada vence en los próximos 7 días.</span>'}</div>
      <div class="q"><span class="sec-t">Para la lista</span><span><b class="num">${nohay}</b> se acabaron · <b class="num">${poco}</b> quedan pocos</span><button class="btn sm line" data-a="tab" data-t="mercado">Ver lista</button></div>
      <div class="q"><span class="sec-t">${q}.ª quincena</span><span><b class="num">${cop(gq)}</b> de ${cop(pq)}</span><div class="progress"><span style="width:${Math.min(100, pq ? gq/pq*100 : 0)}%;${gq>pq?'background:var(--nohay)':''}"></span></div><span class="small muted">${gq > pq ? `Te pasaste ${cop(gq-pq)}` : `Quedan ${cop(pq-gq)}`}</span></div>
      <div class="q"><span class="sec-t">Comida perdida este mes</span><span><b class="num">${cop(m.perdido)}</b> en ${m.nPerdido} producto${m.nPerdido===1?'':'s'}</span><span class="small muted">${m.perdido ? 'Revisa qué se está botando y compra menos de eso.' : 'Muy bien: nada se ha botado.'}</span></div>
    </div>
    ${al.semana.length && S.sample ? `<div class="tip">${ico('ia')}<span>Tienes ${al.semana.length} producto${al.semana.length===1?'':'s'} que vence${al.semana.length===1?'':'n'} esta semana. En <b>Cocinar</b> te sugiero recetas para aprovecharlos.</span></div>` : ''}
  </section>`;
}

/* ---------- Vista: Despensa ---------- */
function vDespensa(){
  if (cargando('productos')) return `<div class="skel"></div>`;
  const q = norm(S.q);
  let ps = S.productos.filter(p => (S.fSecc === 'todas' || p.seccion === S.fSecc) && (S.fLugar === 'todos' || (p.lugar||'Otro') === S.fLugar) && (!q || norm(p.nombre).includes(q) || norm(p.categoria).includes(q)));
  const ord = {nohay:2, poco:1, hay:0};
  ps.sort((a,b) => { const da = a.vence && a.estado!=='nohay' ? dias(a.vence) : 9999, db_ = b.vence && b.estado!=='nohay' ? dias(b.vence) : 9999; return ord[a.estado]-ord[b.estado] || da-db_ || a.nombre.localeCompare(b.nombre,'es'); });
  const grupos = LUGARES.map(l => ({l, items: ps.filter(p => (p.lugar||'Otro') === l)})).filter(g => g.items.length);
  const cuenta = s => S.productos.filter(p => s === 'todas' || p.seccion === s).length;

  return `
    <section class="intro"><h1>Despensa</h1><p>Todo lo que hay en la casa, por lugar. Toca <b>Hay</b>, <b>Poco</b> o <b>No hay</b> cuando algo cambie; toca el nombre para editar la fecha o el lugar.</p></section>
    ${bannerEjemplos()}
    <div class="btns">

      ${S.imgs ? `<button class="btn ghost" data-a="fotoCocina">${ico('camara')} Actualizar con una foto</button>` : ''}
      <button class="btn ghost" data-a="nuevo">${ico('mas')} Agregar producto</button>
    </div>
    ${total ? `<section class="card">
      <div class="seg" role="group" aria-label="Tipo de producto">
        ${[['todas','Todo'],['alimentos','Alimentos'],['aseo','Aseo'],['hogar','Mantenimiento']].map(([k,n]) => `<button data-a="fSecc" data-s="${k}" aria-pressed="${S.fSecc===k}">${k!=='todas'?`<span class="dot" style="--c:${SECC[k].c}"></span>`:''}${n} <span class="muted num">${cuenta(k)}</span></button>`).join('')}
      </div>
      <div class="toolbar">
        <input type="search" id="q" data-i="q" value="${esc(S.q)}" placeholder="Buscar producto…" aria-label="Buscar producto">
      </div>
      <div class="chips" role="group" aria-label="Lugar">
        <button class="chip" data-a="fLugar" data-l="todos" aria-pressed="${S.fLugar==='todos'}">Todos los lugares</button>
        ${lugaresUsados.map(l => `<button class="chip" data-a="fLugar" data-l="${esc(l)}" aria-pressed="${S.fLugar===l}">${esc(l)}<span class="c num">${S.productos.filter(p => (p.lugar||'Otro')===l).length}</span></button>`).join('')}
      </div>
      ${grupos.length ? grupos.map(g => `<div class="group-h"><h3>${esc(g.l)}</h3><span class="c">${g.items.length}</span></div><ul class="items">${g.items.map(filaProducto).join('')}</ul>`).join('')
        : `<div class="empty"><b>Sin resultados</b><span>Prueba con otro nombre o quita los filtros.</span></div>`}
    </section>` : `<div class="empty">
        <b>La despensa está vacía</b>
        <span>La forma más rápida de empezar es la carga masiva: marca lo que tienes en un catálogo de la canasta familiar, pega una lista o usa fotos.</span>
        <div class="btns"><button class="btn" data-a="carga">${ico('despensa')} Carga masiva</button><button class="btn ghost" data-a="nuevo">${ico('mas')} Agregar a mano</button></div>
      </div>`}`;
}

/* ---------- Vista: Cocinar ---------- */
function tieneIngrediente(ing){
  const n = norm(ing); if (!n) return null;
  const ws = n.split(' ').filter(w => w.length > 3);
  return S.productos.find(p => p.seccion === 'alimentos' && p.estado !== 'nohay' && (() => {
    const pn = norm(p.nombre);
    return pn.includes(n) || n.includes(pn) || ws.some(w => pn.split(' ').some(x => x.startsWith(w.slice(0, Math.max(4, w.length-2)))));
  })());
}
function tarjetaReceta(r, idx, esIA){
  const ings = (r.ingredientes || r.usa || []).concat(esIA ? (r.falta||[]) : []);
  const est = ings.map(i => ({i, ok: !!tieneIngrediente(i)}));
  const faltan = est.filter(x => !x.ok);
  return `<article class="receta">
    <div class="card-h"><div><h3>${esc(r.nombre)}</h3><div class="meta">${r.tiempo ? `<span>${esc(r.tiempo)}</span>` : ''}${r.porciones ? `<span>· ${esc(r.porciones)} porciones</span>` : ''}${faltan.length ? `<span class="pill poco">Faltan ${faltan.length}</span>` : `<span class="pill hay">Se puede hacer ya</span>`}</div></div></div>
    ${r.porque ? `<p class="small muted">${esc(r.porque)}</p>` : ''}
    <div class="ing">${est.map(x => `<span class="${x.ok?'':'no'}">${x.ok?'✓':'✗'} ${esc(x.i)}</span>`).join('')}</div>
    ${(r.pasos||[]).length ? `<details><summary>Ver preparación</summary><ol>${r.pasos.map(p => `<li>${esc(p)}</li>`).join('')}</ol></details>` : ''}
    <div class="btns">
      ${faltan.length ? `<button class="btn sm ghost" data-a="faltantes" data-src="${esIA?'ia':'casa'}" data-i="${idx}">Lo que falta a la lista</button>` : ''}
      ${esIA ? `<button class="btn sm" data-a="guardarRecetaIA" data-i="${idx}">Guardar en recetas de la casa</button>` : `<button class="btn sm ghost danger" data-a="borrarReceta" data-id="${r.id}">${M.borrarReceta===r.id?'¿Seguro? Toca otra vez':'Borrar'}</button>`}
    </div>
  </article>`;
}
function vCocinar(){
  if (cargando('productos')) return `<div class="skel"></div>`;
  const al = alertas();
  const prim = al.vencidos.concat(al.semana);
  const disp = S.productos.filter(p => p.seccion === 'alimentos' && p.estado !== 'nohay');
  const porCat = CATS.alimentos.map(c => ({c, ps: disp.filter(p => p.categoria === c)})).filter(g => g.ps.length);
  const recetas = S.recetas.map(r => ({r, f: (r.ingredientes||[]).filter(i => !tieneIngrediente(i)).length})).sort((a,b) => a.f - b.f);
  const ia = S.ia;
  return `
    <section class="intro"><h1>¿Qué cocino hoy?</h1><p>Primero lo que se va a dañar, luego lo que hay. Las recetas de la casa te dicen si tienes todo o qué falta.</p></section>
    <section class="card">
      <div class="card-h"><div><h2>Úsalo primero</h2><p class="muted">Vence en los próximos 7 días.</p></div></div>
      ${prim.length ? `<div class="chips">${prim.map(x => `<span class="pill ${x.d<0?'nohay':x.d<=(S.config.diasAlerta||3)?'poco':'neutral'}">${esc(x.p.nombre)} · ${x.d<0?'vencido':x.d===0?'hoy':x.d===1?'mañana':x.d+' días'}</span>`).join('')}</div>` : `<p class="muted">Nada urgente. Puedes cocinar con libertad.</p>`}
    </section>
    ${S.sample ? `<section class="card ia-card">
      <div class="card-h"><div><span class="sec-t">${ico('ia','')} Con inteligencia artificial</span><h2>Ideas de recetas con lo que hay</h2><p class="muted">Propone 3 recetas que aprovechan primero lo que se vence. Cuentan sal, aceite y agua como disponibles.</p></div></div>
      <label class="fld"><span>¿Algo especial? <em>(opcional)</em></span><input id="iaPref" placeholder="Ej: almuerzo para 4, rápido, sin cerdo, para la lonchera" value="${esc(ia.pref||'')}"></label>
      <div class="btns">
        <button class="btn" data-a="sugerir" ${ia.estado==='cargando'||!disp.length?'disabled':''}>${ico('ia')} ${ia.recetas.length ? 'Otras ideas' : 'Sugerir 3 recetas'}</button>
        ${ia.estado==='cargando' ? `<button class="btn ghost" data-a="pararIA">Detener</button>` : ''}
      </div>
      ${!disp.length ? `<p class="small muted">Primero registra alimentos en la Despensa.</p>` : ''}
      ${ia.estado==='cargando' ? `<div class="loading"><span class="spinner"></span><span>Pensando recetas con lo que hay en la casa… puede tardar hasta un minuto.</span></div>` : ''}
      ${ia.err ? `<div class="banner warn"><p>${esc(ia.err)}</p></div>` : ''}
      ${ia.recetas.length ? `<div class="grid2">${ia.recetas.map((r,i) => tarjetaReceta(r, i, true)).join('')}</div>` : ''}
    </section>` : ''}
    <section class="card">
      <div class="card-h"><div><h2>Recetas de la casa</h2><p class="muted">Las que ya les gustan. Primero aparecen las que se pueden hacer con lo que hay.</p></div><button class="btn sm ghost" data-a="nuevaReceta">${ico('mas')} Nueva receta</button></div>
      ${recetas.length ? `<div class="grid2">${recetas.map(x => tarjetaReceta(x.r, S.recetas.indexOf(x.r), false)).join('')}</div>` : `<div class="empty"><b>Aún no hay recetas guardadas</b><span>Agrega las comidas que más hacen en casa${S.sample ? ' o guarda las ideas que te gusten' : ''}.</span></div>`}
    </section>
    <section class="card">
      <div class="card-h"><div><h2>Lo que hay para cocinar</h2><p class="muted">${disp.length} alimentos disponibles.</p></div></div>
      ${porCat.length ? porCat.map(g => `<div class="fld"><span class="sec-t">${esc(g.c)}</span><div class="chips">${g.ps.map(p => `<span class="pill ${p.estado==='poco'?'poco':'hay'}">${esc(p.nombre)}${p.estado==='poco'?' · poco':''}</span>`).join('')}</div></div>`).join('') : `<p class="muted">No hay alimentos registrados como disponibles.</p>`}
    </section>`;
}

/* ---------- Vista: Mercado ---------- */

    <section class="card">
      <div class="card-h"><div><h2>Registrar un gasto</h2><p class="muted">El mercado de la quincena y también las compras pequeñas: la tienda, la panadería, la droguería.</p></div></div>

        ${S.imgs ? `<button class="btn" data-a="factura">${ico('camara')} Foto de la factura</button>` : ''}

      ${compras.length ? `<div>${compras.map(c => `<details class="compra"><summary>

/* ---------- Vista: Gastos ---------- */
function grafica6(){
  const t = hoy(), P = S.config.presupuesto || 0, meses = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(t.getFullYear(), t.getMonth()-i, 1); meses.push({l: d.toLocaleDateString('es-CO',{month:'short'}).replace('.',''), v: mesStats(mesKey(d)).total, act: i===0}); }
  const max = Math.max(P, ...meses.map(m => m.v), 1) * 1.18;
  const W = 640, H = 250, pl = 10, pr = 10, pt = 28, pb = 32, cw = (W-pl-pr)/6, y = v => pt + (H-pt-pb)*(1 - v/max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto de los últimos 6 meses">`;
  for (let g = 1; g <= 3; g++) { const yy = pt + (H-pt-pb)*g/4; s += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }
  meses.forEach((m,i) => {
    const x = pl + i*cw + cw*.2, w = cw*.6, yy = y(m.v), h = (H-pb) - yy;
    const fill = P && m.v > P ? 'var(--nohay)' : m.act ? 'var(--accent)' : 'var(--accent-soft)';
    if (m.v > 0) s += `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h,2)}" rx="7" fill="${fill}"/>`;
    s += `<text x="${x+w/2}" y="${(m.v>0?yy:H-pb)-8}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="Figtree, sans-serif">${m.v>0?corto(m.v):'—'}</text>`;
    s += `<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="Figtree, sans-serif" ${m.act?'font-weight="700"':''}>${m.l}</text>`;
  });
  if (P) s += `<line x1="${pl}" x2="${W-pr}" y1="${y(P)}" y2="${y(P)}" stroke="var(--sun)" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-pr}" y="${y(P)-7}" text-anchor="end" font-size="12" font-weight="700" fill="var(--sun)" font-family="Figtree, sans-serif">Presupuesto ${corto(P)}</text>`;
  return s + '</svg>';
}

        <div class="q"><span class="sec-t">Lo que queda</span><b>${quedan >= 0 ? cop(quedan) : `Te pasaste ${cop(-quedan)}`}</b><span class="small muted">${quedan > 0 ? `Para ${diasRest} días: unos ${cop(quedan/diasRest)} por día.` : 'Revisa qué se puede aplazar.'}</span></div>

        ${m.secc.sin > 0 ? `<p class="small muted">"Sin clasificar" es lo registrado solo con el total. Con la foto de la factura se clasifica solo.</p>` : ''}

async function guardarProducto(){
  const nombre = $('#pNombre').value.trim();
  if (!nombre) { toast('Escribe el nombre del producto.'); $('#pNombre').focus(); return; }
  const data = {nombre, seccion:M.seccion, categoria:$('#pCat').value, lugar:$('#pLugar').value, estado:M.estado, vence:$('#pVence').value || '', venceAprox:false, por:quien(), actualizado:Date.now()};
  if (data.estado === 'hay') data.noComprar = false;
  let id = M.id;
  if (!id) { const ex = porNombre(nombre); if (ex) id = ex.id; }
  const ok = await guardar(async () => {
    if (id) await S.db.doc('productos/'+id).update(data);
    else { await colec('productos').add({...data, enLista:false, carrito:false, noComprar:false}); registrar(`agregó ${nombre} a la despensa`); }
  }, id && !M.id ? 'Ya existía: lo actualicé.' : 'Guardado.');
  if (ok) cerrarModal();
}

async function leerFactura(files){
  if (!files || !files.length) return;
  M.paso = 'leyendo'; pintarFactura();
  const ctl = new AbortController(); M.ctl = ctl;
  const casa = S.productos.map(p => p.nombre).slice(0, 300);
  const prompt = `Lee la(s) foto(s) de esta factura de compra en Colombia (pesos colombianos; los puntos separan miles: "12.500" son 12500).
Responde SOLO un objeto JSON con esta forma:
{"tienda": string|null, "fecha": "AAAA-MM-DD"|null, "total": number|null, "items": [{"texto": "como aparece en la factura", "nombre": "nombre claro y corto en español", "seccion": "alimentos"|"aseo"|"hogar", "categoria": string, "valor": number, "perecedero": boolean, "diasVence": number|null}]}
Reglas:
- "valor" es el valor total pagado por esa línea, en pesos, sin puntos.
- "total" es el valor final pagado de la factura.
- No incluyas como productos: descuentos, IVA, subtotales, bolsas, propinas ni medios de pago.
- seccion "alimentos" = comida y bebidas; "aseo" = aseo personal, limpieza, lavandería, papel higiénico y desechables; "hogar" = mantenimiento y dotación (bombillos, pilas, ferretería, menaje de cocina, toallas, sábanas).
- categoria debe ser exactamente una de estas, según la sección:
  alimentos: ${CATS.alimentos.join(' | ')}
  aseo: ${CATS.aseo.join(' | ')}
  hogar: ${CATS.hogar.join(' | ')}
- "diasVence": solo para perecederos, días aproximados que dura en buen estado desde la compra (leche 7, carne 3, pan 4, verduras 7). Si no es perecedero, null.
- Si un producto corresponde a uno de esta lista de la casa, usa exactamente ese nombre: ${JSON.stringify(casa)}`;
  try {
    const res = await S.sample.json(prompt, {images: files, signal: ctl.signal});
    if (M.tipo !== 'factura') return;
    const items = Array.isArray(res?.items) ? res.items : [];
    if (!items.length && !res?.total) throw {code:'vacio'};
    M.res = res || {};
    M.items = items.map(it => {
      const seccion = SECC[it.seccion] ? it.seccion : 'alimentos';
      const categoria = CATS[seccion].includes(it.categoria) ? it.categoria : CATS[seccion][CATS[seccion].length-1];
      return {texto: String(it.texto||''), nombre: String(it.nombre||it.texto||'').trim(), seccion, categoria, valor: Math.round(+it.valor||0), perecedero: !!it.perecedero, diasVence: +it.diasVence || null, inc: true, existe: !!porNombre(it.nombre)};
    });
    M.paso = 'revisar'; pintarFactura();
  } catch (e) {
    if (M.tipo !== 'factura' || e?.code === 'cancelled') return;
    M.paso = 'foto'; pintarFactura();
    toast(mensajeIA(e, 'No pude leer la factura. Prueba con una foto más clara o escribe el total.'));

function leerRevisionFactura(){
  M.items.forEach((it, i) => {
    const n = document.getElementById('fN_'+i); if (!n) return;
    it.nombre = n.value.trim(); it.valor = pesos(document.getElementById('fV_'+i).value);
    const s = document.getElementById('fS_'+i).value;
    if (s !== it.seccion) { it.seccion = s; it.categoria = CATS[s][CATS[s].length-1]; }
  });
  M.res.tienda = $('#fTienda').value; M.res.fecha = $('#fFecha').value; M.res.total = pesos($('#fTotal').value);
}
async function marcarComprado(it, fecha){
  const p = porNombre(it.nombre);
  const venceN = it.perecedero && it.diasVence ? sumarDias(fecha, it.diasVence) : (VIDA[it.categoria] && it.seccion === 'alimentos' && it.perecedero ? sumarDias(fecha, VIDA[it.categoria]) : '');
  if (p) {
    const upd = {estado:'hay', carrito:false, enLista:false, noComprar:false, por:quien(), actualizado:Date.now()};
    if (it.valor) upd.ultimoPrecio = it.valor;
    if (venceN) { upd.vence = venceN; upd.venceAprox = true; } else if (p.estado === 'nohay') { upd.vence = ''; }
    await S.db.doc('productos/'+p.id).update(upd);
  } else {
    await colec('productos').add({nombre: it.nombre, seccion: it.seccion, categoria: it.categoria, lugar: lugarSugerido(it.seccion, it.categoria), estado:'hay', vence: venceN, venceAprox: !!venceN, ultimoPrecio: it.valor || 0, enLista:false, carrito:false, noComprar:false, por:quien(), actualizado:Date.now()});
  }
  for (const l of S.lista.filter(l => norm(l.nombre) === norm(it.nombre))) await S.db.doc('lista/'+l.id).delete();
}
async function guardarFactura(){
  leerRevisionFactura();
  const items = M.items.filter(i => i.inc && i.nombre);
  const total = M.res.total || items.reduce((a,i) => a + i.valor, 0);
  if (!total) { toast('Escribe el total pagado.'); return; }
  const btn = $('#fGuardarBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  const fecha = M.res.fecha || iso(hoy());
  const ok = await guardar(async () => {
    await colec('compras').add({fecha, tienda: (M.res.tienda||'').trim(), total, tipo: M.tipoCompra, fuente:'factura', items: items.map(i => ({nombre:i.nombre, seccion:i.seccion, categoria:i.categoria, valor:i.valor})), por: quien(), creado: Date.now()});
    for (const it of items) await marcarComprado(it, fecha);
    registrar(`registró la factura${M.res.tienda ? ' de ' + M.res.tienda : ''} por ${cop(total)} (${items.length} productos)`);
  }, `Listo: compra guardada y ${items.length} productos quedaron como Hay.`);
  if (ok) cerrarModal(); else if (btn) { btn.disabled = false; btn.textContent = 'Guardar compra'; }
}

async function leerCocina(files){
  if (!files || !files.length) return;
  M.paso = 'leyendo'; pintarCocina();
  const ctl = new AbortController(); M.ctl = ctl;
  const aqui = S.productos.filter(p => (p.lugar||'Otro') === M.lugar).map(p => ({nombre:p.nombre, estado:p.estado}));
  const otros = S.productos.filter(p => (p.lugar||'Otro') !== M.lugar).map(p => p.nombre).slice(0, 250);
  const prompt = `Estas fotos muestran "${M.lugar}" en una casa en Colombia. Identifica los productos que se ven con claridad (alimentos, productos de aseo o artículos del hogar).
Productos registrados en este lugar (con su estado): ${JSON.stringify(aqui)}
Otros productos registrados en la casa: ${JSON.stringify(otros)}
Responde SOLO un objeto JSON con esta forma:
{"vistos":[{"nombre": string, "registrado": boolean, "estado": "hay"|"poco", "seccion": "alimentos"|"aseo"|"hogar", "categoria": string}], "noVistos":[string], "malEstado":[{"nombre": string, "nota": string}]}
Reglas:
- Si lo que ves corresponde a un producto registrado, usa exactamente ese nombre y "registrado": true.
- "poco" si el envase se ve casi vacío o queda poca cantidad; si no, "hay".
- "noVistos": nombres de productos registrados EN ESTE LUGAR que no aparecen en las fotos.
- "malEstado": alimentos que se ven dañados, marchitos o con moho.
- No inventes productos que no se distinguen con claridad. Usa nombres cortos en español (ej: "Leche entera", "Huevos", "Tomate").
- categoria debe ser una de: alimentos: ${CATS.alimentos.join(' | ')}; aseo: ${CATS.aseo.join(' | ')}; hogar: ${CATS.hogar.join(' | ')}`;
  try {
    const r = await S.sample.json(prompt, {images: files, signal: ctl.signal});
    if (M.tipo !== 'cocina') return;
    const cambios = []; let iguales = 0;
    for (const v of (Array.isArray(r?.vistos) ? r.vistos : [])) {
      const nombre = String(v.nombre||'').trim(); if (!nombre) continue;
      const est = v.estado === 'poco' ? 'poco' : 'hay';
      const p = porNombre(nombre);
      if (p) {
        if (p.estado === est) { iguales++; continue; }
        cambios.push({k:'estado', id:p.id, nombre:p.nombre, estado:est, inc:true, desc:`${EST[p.estado].n} → ${EST[est].n}`, pill:`<span class="pill ${est}">${EST[est].n}</span>`});
      } else {
        const seccion = SECC[v.seccion] ? v.seccion : 'alimentos';
        const categoria = CATS[seccion].includes(v.categoria) ? v.categoria : CATS[seccion][CATS[seccion].length-1];
        cambios.push({k:'nuevo', nombre, estado:est, seccion, categoria, inc:true, desc:`${categoria} · se guardará en ${M.lugar}`, pill:`<span class="pill ${est}">${EST[est].n}</span>`});
      }
    }
    for (const n of (Array.isArray(r?.noVistos) ? r.noVistos : [])) {
      const p = porNombre(n); if (!p || p.estado === 'nohay' || (p.lugar||'Otro') !== M.lugar || cambios.some(c => c.id === p.id)) continue;
      cambios.push({k:'novisto', id:p.id, nombre:p.nombre, inc:false, desc:'¿Se acabó? Pasará a la lista de compras.', pill:`<span class="pill nohay">Se acabó</span>`});
    }
    for (const m of (Array.isArray(r?.malEstado) ? r.malEstado : [])) {
      const p = porNombre(m.nombre); if (!p) continue;
      cambios.push({k:'mal', id:p.id, nombre:p.nombre, inc:false, desc: esc(m.nota || 'Se ve en mal estado'), pill:`<span class="pill nohay">Botar</span>`});
    }
    M.cambios = cambios; M.iguales = iguales; M.paso = 'revisar'; pintarCocina();
  } catch (e) {
    if (M.tipo !== 'cocina' || e?.code === 'cancelled') return;
    M.paso = 'foto'; pintarCocina();
    toast(mensajeIA(e, 'No pude reconocer los productos. Prueba con una foto más clara.'));
  }
}
async function aplicarCocina(){
  const sel = M.cambios.filter(c => c.inc);
  if (!sel.length) { toast('No marcaste ningún cambio.'); return; }
  const btn = $('#cAplicarBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Aplicando…'; }
  const lugar = M.lugar, base = {por:quien(), actualizado:Date.now()};
  const ok = await guardar(async () => {
    for (const c of sel) {
      if (c.k === 'nuevo') {
        const vence = c.seccion === 'alimentos' && VIDA[c.categoria] ? sumarDias(iso(hoy()), VIDA[c.categoria]) : '';
        await colec('productos').add({nombre:c.nombre, seccion:c.seccion, categoria:c.categoria, lugar, estado:c.estado, vence, venceAprox:!!vence, enLista:false, carrito:false, noComprar:false, ...base});
      } else if (c.k === 'estado') await S.db.doc('productos/'+c.id).update({estado:c.estado, noComprar:false, ...base});
      else if (c.k === 'novisto') await S.db.doc('productos/'+c.id).update({estado:'nohay', noComprar:false, ...base});
      else if (c.k === 'mal') {
        const p = byId(c.id);
        await colec('mermas').add({fecha: iso(hoy()), nombre: c.nombre, productoId: c.id, valor: p?.ultimoPrecio || 0, motivo:'Se dañó', por: quien(), ts: Date.now()});
        await S.db.doc('productos/'+c.id).update({estado:'nohay', vence:'', venceAprox:false, noComprar:false, ...base});
      }
    }
    registrar(`actualizó ${lugar} con una foto (${sel.length} cambio${sel.length===1?'':'s'})`);
  }, `Listo: ${sel.length} cambio${sel.length===1?'':'s'} en ${lugar}.`);
  if (ok) cerrarModal(); else if (btn) { btn.disabled = false; btn.textContent = 'Aplicar cambios'; }
}
function mensajeIA(e, base){
  const c = e?.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Para usar la inteligencia artificial hay que permitirlo cuando Claude lo pregunte.';
  if (c === 'rate_limited') return 'Se alcanzó el límite de uso por ahora. Intenta más tarde.';
  if (c === 'image_rejected') return 'Esa imagen no sirve: prueba con otra foto (JPG o PNG).';
  if (c === 'images_unavailable') { S.imgs = null; render(); return 'Esta cuenta no permite leer fotos. Puedes registrar a mano.'; }
  return base;
}

async function faltantesALista(src, i){

function clasificar(nombre, lugar){
  const n = norm(nombre), w = n.split(' ')[0];
  const c = CAT_ITEMS.find(i => norm(i.nombre) === n)
    || CAT_ITEMS.find(i => norm(i.nombre).startsWith(n) || n.includes(norm(i.nombre)))
    || (w.length > 3 && CAT_ITEMS.find(i => norm(i.nombre).split(' ')[0] === w));
  if (c) return {seccion:c.seccion, categoria:c.categoria, lugar:c.lugar, conocido:true};
  const l = lugar || 'Alacena';
  const por = {'Baño':['aseo','Aseo personal'], 'Lavadero':['aseo','Limpieza de la casa'], 'Bodega':['hogar','Otros del hogar'], 'Congelador':['alimentos','Congelados']}[l] || ['alimentos','Otros alimentos'];
  return {seccion:por[0], categoria:por[1], lugar:l, conocido:false};
}
function parsearLista(txt){
  const out = [], vistos = new Set();
  const rxLug = new RegExp('\\b(en (la |el )?)?(' + LUGARES.map(norm).join('|') + ')\\b', 'g');
  for (const raw of String(txt).split(/\r?\n/)) {
    let l = raw.replace(/^\s*([-*•·]|\d+[.)])\s+/, '').trim(); if (!l) continue;
    const n = norm(l);
    const estado = /\b(no hay|agotad[oa]s?|se acabo|acabad[oa]|falta)\b/.test(n) ? 'nohay' : /\b(poco|poca|pocos|pocas|casi|bajo)\b/.test(n) ? 'poco' : 'hay';
    const lugar = LUGARES.find(x => new RegExp('\\b' + norm(x) + '\\b').test(n));
    let nombre = norm(l.split(/\t|;|\||,| - /)[0])
      .replace(/^\d+([.,]\d+)?\s*(kg|kilos?|g|gr|gramos|lb|libras?|l|lt|litros?|ml|und|unidades?|paquetes?|bolsas?|cajas?|latas?|x)?\.?\s+(de\s+)?/, '')
      .replace(/\b(no hay|agotad[oa]s?|se acabo|queda poco|poco|poca|hay)\b/g, '').replace(rxLug, '')
      .replace(/\s{2,}/g, ' ').replace(/^[\s,;:-]+|[\s,;:-]+$/g, '').trim();
    if (!nombre || vistos.has(nombre)) continue; vistos.add(nombre);
    const cat = CAT_ITEMS.find(i => norm(i.nombre) === nombre);
    const bonito = cat ? cat.nombre : nombre.charAt(0).toUpperCase() + nombre.slice(1);
    const cl = clasificar(bonito, lugar);
    out.push({nombre: bonito, estado, lugar: lugar || cl.lugar, lugarFijo: !!lugar, seccion: cl.seccion, categoria: cl.categoria, conocido: cl.conocido, inc: true});
  }
  return out;
}

async function guardarMasivo(items){
  const btn = $('#cgGuardar'); let n = 0;
  if (btn) btn.disabled = true;
  const hoyS = iso(hoy());
  const ok = await guardar(async () => {
    for (const it of items) {
      n++; if (btn) btn.textContent = `Guardando ${n} de ${items.length}…`;
      const p = porNombre(it.nombre), base = {por:quien(), actualizado:Date.now()};
      if (p) { await S.db.doc('productos/'+p.id).update({estado:it.estado, lugar:it.lugar, noComprar:false, ...base}); continue; }
      const vence = it.estado !== 'nohay' && it.seccion === 'alimentos' && VIDA[it.categoria] && it.categoria !== 'Congelados' ? sumarDias(hoyS, VIDA[it.categoria]) : '';
      await colec('productos').add({nombre:it.nombre, seccion:it.seccion, categoria:it.categoria, lugar:it.lugar, estado:it.estado, vence, venceAprox:!!vence, enLista:false, carrito:false, noComprar:false, ...base});
    }

  }, `Listo: ${items.length} producto${items.length===1?'':'s'} en la despensa.`);
  if (!ok && btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
  return ok;
}
